name: validate-skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skills and check README is up to date
        run: |
          bash scripts/validate-skills.sh
          git diff --exit-code README.md || {
            echo "README.md is out of date. Run scripts/validate-skills.sh and commit the result."
            exit 1
          }
